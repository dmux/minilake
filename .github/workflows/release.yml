name: Release

# Tag a commit `vX.Y.Z` and push the tag -- this builds a multi-arch image,
# publishes it to GitHub Container Registry (ghcr.io/dmux/minilake) and to PyPI,
# and creates a GitHub Release, all automatically.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheapest possible gate, and it runs before anything is published: a tag that
      # disagrees with pyproject.toml would ship an image labelled one version and a
      # wheel containing another, and PyPI uploads cannot be replaced.
      - name: Check the tag matches the packaged version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag is v${tag_version} but pyproject.toml says ${pkg_version}."
            echo "Bump the version, run 'uv lock', commit, then re-tag."
            exit 1
          fi
          echo "Version ${pkg_version} confirmed."

      - name: Run test suite in Docker
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi-publish:
    needs: test
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's identity through GitHub's OIDC
    # provider, so there is no API token to store, leak or rotate. The environment name
    # is part of what PyPI checks — it must match the publisher configured there.
    environment:
      name: pypi
      url: https://pypi.org/p/minilake
    permissions:
      id-token: write # required for OIDC; nothing else is needed here
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build-and-publish, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```bash
            pip install minilake==${{ needs.build-and-publish.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build-and-publish.outputs.version }}
            ```

            - PyPI: https://pypi.org/project/minilake/${{ needs.build-and-publish.outputs.version }}/
            - Container image: `ghcr.io/${{ github.repository }}:${{ needs.build-and-publish.outputs.version }}`
