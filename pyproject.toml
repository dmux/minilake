[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minilake"
version = "1.5.0"
description = "A local Databricks API emulator backed by DuckDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rafael Sales", email = "rafael.sales@gmail.com" }
]
keywords = ["databricks", "emulator", "duckdb", "delta-lake", "unity-catalog", "spark", "mcp", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Floor raised from 2.7 to satisfy the `mcp` extra (mcp>=1.29 needs pydantic>=2.11);
    # keeping a single floor avoids a resolution that silently works without the extra
    # and breaks with it.
    "pydantic>=2.11",
    "pydantic-settings>=2.3",
    "duckdb>=1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "docker>=7.1",
    "pyarrow>=14.0",
    "cryptography>=42.0",
]

# Keep this below `dependencies`: a `[table]` header ends the parent table, so anything
# declared after it would be parsed as a URL rather than a project field.
[project.urls]
Homepage = "https://github.com/dmux/minilake"
Documentation = "https://github.com/dmux/minilake/blob/main/docs/index.md"
Repository = "https://github.com/dmux/minilake"
Issues = "https://github.com/dmux/minilake/issues"
Changelog = "https://github.com/dmux/minilake/releases"

[project.optional-dependencies]
# MCP server (exposes minilake's capabilities to LLM agents at /mcp). Optional so the
# base install stays free of the SDK's transitive deps (jsonschema, pyjwt[crypto],
# sse-starlette, ...). Pinned to the 1.x line: 2.0 renames FastMCP -> MCPServer and
# removes mcp.server.fastmcp outright, so it is a rewrite, not a bump.
mcp = ["mcp>=1.29,<2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mcp>=1.29,<2",
    "databricks-sdk>=0.40",
    "ruff>=0.6",
    "pre-commit>=3.8",
    # Lightweight (no JVM/Spark) real Delta Lake writer, used only to validate
    # minilake's delta_scan()-based EXTERNAL table read path in tests. Actual
    # users write Delta tables with real Spark (jobs or the notebook service).
    "deltalake>=0.19",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.scripts]
minilake = "minilake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minilake"]

[tool.hatch.build.targets.sdist]
# The sdist is what someone builds from, so it carries the source, the docs and the
# compose files. Agent config and local tooling are not part of that.
exclude = [
    "/.claude",
    "/.mcp.json",
    "/.github",
    "/htmlcov",
    "/data",
    "/scratchpad",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--dist=loadfile -v"
# Strict mode: async tests must be marked explicitly, so pytest-asyncio never silently
# takes over the existing sync (databricks-sdk) tests.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "serial: tests that cannot run in parallel (mutate global state)",
    "crud: create/read/update/delete operations",
    "workflow: multi-step end-to-end flows",
    "error: error handling and edge cases",
    "smoke: quick sanity checks",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line too long (handled by formatter)
